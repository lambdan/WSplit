name: Native builds

on:
  push:
    branches: [master]
    tags: ['v*']
    paths: ['native/**', '.github/workflows/native.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04   # GTK >= 4.12
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-4-dev libfreetype-dev
      - name: Build
        run: make -C native wsplit
      - name: Unit tests
        run: make -C native test
      - name: Screenshot smoke test
        run: |
          for m in 0 1 2 3; do
            native/wsplit --screenshot shot$m.png --mode $m --simulate 4 native/examples/sm64_16star.wsplit
          done
      - name: Package
        run: |
          d=wsplit-linux-x86_64
          mkdir -p $d
          cp native/wsplit native/README.md native/linux/io.github.lambdan.WSplit.desktop $d/
          cp -r native/assets $d/
          cp native/examples/*.wsplit $d/
          tar czf $d.tar.gz $d
      - uses: actions/upload-artifact@v4
        with:
          name: wsplit-linux-x86_64
          path: wsplit-linux-x86_64.tar.gz

  macos:
    name: macOS universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build WSplit.app
        run: make -C native app
      - name: Unit tests
        run: make -C native test
      - name: Package (unsigned, ad-hoc)
        run: |
          cd native
          ditto -c -k --keepParent WSplit.app ../WSplit-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: WSplit-macOS
          path: WSplit-macOS.zip

  windows:
    name: Windows x86_64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: make mingw-w64-x86_64-gcc zip
      - name: Build
        run: make -C native windows WIN_CC=gcc WINDRES=windres
      - name: Unit tests
        run: make -C native test CC=gcc
      - name: Screenshot smoke test
        run: |
          mkdir -p shots
          for m in 0 1 2 3; do
            ./native/WSplit.exe --screenshot shots/mode$m.png --mode $m --simulate 4 native/examples/sm64_16star.wsplit
            test -s shots/mode$m.png
          done
      - uses: actions/upload-artifact@v4
        with:
          name: windows-screenshots
          path: shots/
      - name: Package
        run: |
          d=WSplit-windows-x86_64
          mkdir -p $d
          cp native/WSplit.exe native/README.md native/examples/*.wsplit $d/
          zip -r $d.zip $d
      - uses: actions/upload-artifact@v4
        with:
          name: WSplit-windows-x86_64
          path: WSplit-windows-x86_64.zip

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: '[wW][sS]plit-*'
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "WSplit native $GITHUB_REF_NAME" --generate-notes
